<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050" role="img" aria-labelledby="title desc">
<title id="title">Diagrama del modelo SEM de referencia ECP 2023</title>
<desc id="desc">Dos factores exógenos de confianza covarían y predicen la familiaridad autorreportada con mecanismos de participación, medida por seis indicadores.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker>
  <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M10,0 L0,5 L10,10 z" fill="#8e44ad"/></marker>
  <style>
    .bg{fill:#fff}.obs{fill:#f5f8fc;stroke:#38668a;stroke-width:2}.latent{fill:#e9f4ee;stroke:#26734d;stroke-width:3}
    .edge{fill:none;stroke:#34495e;stroke-width:2;marker-end:url(#arrow)}.struct{fill:none;stroke:#b04436;stroke-width:4;marker-end:url(#arrow)}
    .cov{fill:none;stroke:#8e44ad;stroke-width:3;marker-start:url(#arrowStart);marker-end:url(#arrow)}
    .txt{font:16px Arial,sans-serif;fill:#152536}.small{font:14px Arial,sans-serif;fill:#263746}
    .head{font:bold 18px Arial,sans-serif;fill:#16324f}.latlab{font:bold 17px Arial,sans-serif;fill:#17583a}
    .hyp{font:bold 17px Arial,sans-serif;fill:#9d3327}.note{font:14px Arial,sans-serif;fill:#4f5d6b}
  </style>
</defs>
<rect class="bg" width="1680" height="1050"/>
<text class="head" x="30" y="34">Indicadores observados x</text>
<text class="head" x="1300" y="350">Indicadores observados y</text>
<text class="small" x="30" y="65">Confianza interpersonal</text>
<text class="small" x="30" y="292">Confianza institucional</text>
<path class="edge" d="M260 100 C370 100, 430 158, 485 180"/><rect class="obs" x="30" y="84" width="230" height="32" rx="3"/><text class="txt" x="39" y="105">P2025S4  Desconocidos</text><path class="edge" d="M260 142 C370 142, 430 170, 485 180"/><rect class="obs" x="30" y="126" width="230" height="32" rx="3"/><text class="txt" x="39" y="147">P2025S5  Vecinos</text><path class="edge" d="M260 184 C370 184, 430 182, 485 180"/><rect class="obs" x="30" y="168" width="230" height="32" rx="3"/><text class="txt" x="39" y="189">P2025S6  Amistades</text><path class="edge" d="M260 226 C370 226, 430 194, 485 180"/><rect class="obs" x="30" y="210" width="230" height="32" rx="3"/><text class="txt" x="39" y="231">P2025S7  Otra nacionalidad</text><path class="edge" d="M260 324 C360 324, 405 535, 485 560"/><rect class="obs" x="30" y="310" width="230" height="28" rx="3"/><text class="txt" x="39" y="331">P5263S1  Procuraduria</text><path class="edge" d="M260 358 C360 358, 405 539, 485 560"/><rect class="obs" x="30" y="344" width="230" height="28" rx="3"/><text class="txt" x="39" y="365">P5263S2  Alcaldia</text><path class="edge" d="M260 392 C360 392, 405 543, 485 560"/><rect class="obs" x="30" y="378" width="230" height="28" rx="3"/><text class="txt" x="39" y="399">P5263S3  Fuerzas Militares</text><path class="edge" d="M260 426 C360 426, 405 547, 485 560"/><rect class="obs" x="30" y="412" width="230" height="28" rx="3"/><text class="txt" x="39" y="433">P5263S4  Congreso</text><path class="edge" d="M260 460 C360 460, 405 551, 485 560"/><rect class="obs" x="30" y="446" width="230" height="28" rx="3"/><text class="txt" x="39" y="467">P5263S5  Jueces</text><path class="edge" d="M260 494 C360 494, 405 555, 485 560"/><rect class="obs" x="30" y="480" width="230" height="28" rx="3"/><text class="txt" x="39" y="501">P5263S6  Asamblea</text><path class="edge" d="M260 528 C360 528, 405 559, 485 560"/><rect class="obs" x="30" y="514" width="230" height="28" rx="3"/><text class="txt" x="39" y="535">P5263S7  Contraloria</text><path class="edge" d="M260 562 C360 562, 405 563, 485 560"/><rect class="obs" x="30" y="548" width="230" height="28" rx="3"/><text class="txt" x="39" y="569">P5263S8  Concejos</text><path class="edge" d="M260 596 C360 596, 405 567, 485 560"/><rect class="obs" x="30" y="582" width="230" height="28" rx="3"/><text class="txt" x="39" y="603">P5263S9  Policia</text><path class="edge" d="M260 630 C360 630, 405 571, 485 560"/><rect class="obs" x="30" y="616" width="230" height="28" rx="3"/><text class="txt" x="39" y="637">P5263S10 Partidos</text><path class="edge" d="M260 664 C360 664, 405 575, 485 560"/><rect class="obs" x="30" y="650" width="230" height="28" rx="3"/><text class="txt" x="39" y="671">P5263S11 Defensoria</text><path class="edge" d="M260 698 C360 698, 405 579, 485 560"/><rect class="obs" x="30" y="684" width="230" height="28" rx="3"/><text class="txt" x="39" y="705">P5263S12 Gobernacion</text><path class="edge" d="M260 732 C360 732, 405 583, 485 560"/><rect class="obs" x="30" y="718" width="230" height="28" rx="3"/><text class="txt" x="39" y="739">P5263S13 Fiscalia</text><path class="edge" d="M260 766 C360 766, 405 587, 485 560"/><rect class="obs" x="30" y="752" width="230" height="28" rx="3"/><text class="txt" x="39" y="773">P5263S14 Registraduria</text><path class="edge" d="M260 800 C360 800, 405 591, 485 560"/><rect class="obs" x="30" y="786" width="230" height="28" rx="3"/><text class="txt" x="39" y="807">P5263S15 Presidencia</text><ellipse class="latent" cx="570" cy="180" rx="105" ry="62"/><text class="latlab" text-anchor="middle" x="570" y="169">ξ₁</text><text class="txt" text-anchor="middle" x="570" y="192">Confianza</text><text class="txt" text-anchor="middle" x="570" y="213">interpersonal</text>
<ellipse class="latent" cx="570" cy="560" rx="105" ry="62"/><text class="latlab" text-anchor="middle" x="570" y="549">ξ₂</text><text class="txt" text-anchor="middle" x="570" y="572">Confianza</text><text class="txt" text-anchor="middle" x="570" y="593">institucional</text>
<path class="cov" d="M670 220 C785 290,785 450,670 520"/><text class="small" x="785" y="375" fill="#8e44ad">H3: φ₁₂ &gt; 0</text>
<ellipse class="latent" cx="1070" cy="560" rx="125" ry="72"/><text class="latlab" text-anchor="middle" x="1070" y="545">η₁</text><text class="txt" text-anchor="middle" x="1070" y="568">Familiaridad con</text><text class="txt" text-anchor="middle" x="1070" y="590">mecanismos</text>
<path class="struct" d="M670 205 C795 230,875 420,952 535"/><text class="hyp" x="790" y="286">H1: γ₁₁ &gt; 0</text>
<path class="struct" d="M675 560 L942 560"/><text class="hyp" x="780" y="545">H2: γ₁₂ &gt; 0</text>
<path class="edge" d="M1195 560 C1240 560, 1240 407, 1290 407"/><rect class="obs" x="1300" y="390" width="340" height="34" rx="3"/><text class="txt" x="1309" y="411">P5376S1  Revocatoria</text><path class="edge" d="M1195 560 C1240 560, 1240 462, 1290 462"/><rect class="obs" x="1300" y="445" width="340" height="34" rx="3"/><text class="txt" x="1309" y="466">P5376S2  Iniciativa popular</text><path class="edge" d="M1195 560 C1240 560, 1240 517, 1290 517"/><rect class="obs" x="1300" y="500" width="340" height="34" rx="3"/><text class="txt" x="1309" y="521">P5376S3  Referendo</text><path class="edge" d="M1195 560 C1240 560, 1240 572, 1290 572"/><rect class="obs" x="1300" y="555" width="340" height="34" rx="3"/><text class="txt" x="1309" y="576">P5376S4  Plebiscito</text><path class="edge" d="M1195 560 C1240 560, 1240 627, 1290 627"/><rect class="obs" x="1300" y="610" width="340" height="34" rx="3"/><text class="txt" x="1309" y="631">P5376S5  Consulta popular</text><path class="edge" d="M1195 560 C1240 560, 1240 682, 1290 682"/><rect class="obs" x="1300" y="665" width="340" height="34" rx="3"/><text class="txt" x="1309" y="686">P5376S6  Cabildo abierto</text><text class="note" x="30" y="930">Flechas sencillas: cargas y regresiones. Flecha doble: covarianza entre factores exógenos.</text>
<text class="note" x="30" y="954">Por legibilidad se omiten δ, ε y ζ; están incluidos en las ecuaciones y matrices del documento de especificación.</text>
<text class="note" x="30" y="978">Ítems de confianza: categorías 1-5; indicadores de conocimiento: Sí=1, No=0.</text>
</svg>
